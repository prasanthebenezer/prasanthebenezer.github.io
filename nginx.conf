# Portfolio container: serves the static site and /api/contact over plain HTTP
# on the "edge" network. TLS, www -> apex and every other subdomain are handled
# by the edge proxy (/root/edge-proxy), which forwards prasanthebenezer.com here.
server {
    listen 80;
    server_name prasanthebenezer.com _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Redirects stay relative so they keep the https://prasanthebenezer.com origin.
    absolute_redirect off;

    # Only the edge proxy can reach this port; trust its X-Real-IP so access logs
    # and the contact form's per-IP rate limit see the visitor, not the proxy.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Long-cache truly static binary assets that rarely change.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Short revalidating cache for assets that may change (CSS, JS, PDF/CV).
    # Browsers send If-None-Match and we 304 if unchanged — but a fresh upload is
    # picked up within an hour even without a query-string bump.
    location ~* \.(css|js|pdf)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Security headers (HSTS is added by the edge proxy)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # VoiceStudio lives on its own subdomain (its UI needs the domain root).
    location ~ ^/tts(/.*)?$ {
        return 301 https://tts.prasanthebenezer.com$1$is_args$args;
    }

    # Contact-form backend (contact/ service in docker-compose.yml)
    location = /api/contact {
        client_max_body_size 32k;
        proxy_pass http://contact:8080;
        proxy_set_header X-Real-IP $remote_addr;   # visitor IP, via real_ip above
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 30s;
    }

    # Handle routing for SPA (if needed)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Error pages
    error_page 404 /index.html;
}
