services:
  # Static portfolio + /api/contact over plain HTTP. Not published on the host:
  # the edge proxy (/root/edge-proxy) terminates TLS and forwards
  # prasanthebenezer.com to host "portfolio" on the external "edge" network.
  portfolio:
    build: .
    image: prasanthebenezer-portfolio
    container_name: prasanthebenezer-portfolio
    restart: unless-stopped
    depends_on:
      - contact
    networks:
      default:
      edge:
        aliases: [portfolio]

  # Contact-form backend, reachable only from the portfolio nginx at /api/contact
  # (default network only, not on the edge network).
  # Secrets live in /etc/contact-form.env on the VPS (chmod 600, not in git).
  contact:
    build: ./contact
    image: prasanthebenezer-contact
    container_name: prasanthebenezer-contact
    restart: unless-stopped
    env_file: /etc/contact-form.env
    read_only: true

networks:
  edge:
    name: edge
    external: true
